[project]
name = "educational-nmt"
version = "0.1.0"
description = "A small educational neural machine translation project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0,<7",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
