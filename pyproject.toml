[project]
name = "machine_translation"
version = "0.1.0"
description = "A small educational neural machine translation project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pydantic>=2.10,<3",
    "PyYAML>=6.0,<7",
    "scikit-learn>=1.7.2",
    "tokenizers>=0.23,<0.24",
    "torch>=2.14.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
